services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "false"
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: tickets
      DB_POSTGRESDB_USER: tickets
      DB_POSTGRESDB_PASSWORD: tickets
      N8N_ENCRYPTION_KEY: replace-this-with-a-long-random-secret-before-use
    volumes:
      - n8n_data:/home/node/.n8n
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tickets:tickets@db:5432/tickets
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
